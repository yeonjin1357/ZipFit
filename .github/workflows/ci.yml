name: Verify ZipFit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install uv
        run: python -m pip install uv==0.7.19
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run --frozen pytest -q
      - name: Audit bundled notice data and PDFs
        run: uv run --frozen python -m zipfit.audit
