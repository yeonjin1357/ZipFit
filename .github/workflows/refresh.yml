name: Refresh housing notices

on:
  schedule:
    - cron: '17 */6 * * *'
    - cron: '47 3 * * 0'
  workflow_dispatch:
    inputs:
      discovery:
        description: 'Expand to 6 pages and 365 days'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: housing-notice-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.7.19
          uv sync --frozen
      - name: Test collectors and eligibility rules
        run: uv run --frozen pytest -q
      - name: Collect recent public lists
        if: github.event.schedule != '47 3 * * 0' && inputs.discovery != true
        run: uv run --frozen python -m zipfit.collect --pages 2
      - name: Scan broader publication range
        if: github.event.schedule == '47 3 * * 0' || inputs.discovery == true
        run: uv run --frozen python -m zipfit.collect --pages 6 --lookback-days 365 --discovery
      - name: Refresh application periods
        run: uv run --frozen python -m zipfit.schedules --limit 80
      - name: Recheck reviewed source versions
        run: uv run --frozen python -m zipfit.verification
      - name: Audit and prepare catalog
        run: |
          uv run --frozen python -m scripts.prepare_release
          uv run --frozen python -m zipfit.review --output tmp/review/index.html
      - name: Keep public-source review report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notice-review-${{ github.run_id }}
          path: |
            tmp/review/
            data/runtime/verification/
          retention-days: 7
          if-no-files-found: warn
      - name: Publish audited public catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/release-catalog.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public housing notices and source checks'
            git push origin HEAD:main
          fi
      - name: Report partial source failures
        run: uv run --frozen python -m scripts.check_refresh
