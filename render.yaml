services:
  - type: web
    name: zipfit
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install --require-hashes -r requirements.txt
    startCommand: uvicorn zipfit.main:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: ZIPFIT_ENV
        value: production
